services:
  postgres:
    image: postgres:16-alpine
    container_name: orbit-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orbit}
      POSTGRES_USER: ${POSTGRES_USER:-orbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbit_dev}
    ports:
      - "5432:5432"
    volumes:
      - orbit_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orbit-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - orbit_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: orbit-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-orbit_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-orbit_minio_dev}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - orbit_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: orbit-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-orbit_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-orbit_minio_dev}
      AWS_CLOUD_FILES_BUCKET: ${AWS_CLOUD_FILES_BUCKET:-orbit-cloud-files}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$AWS_CLOUD_FILES_BUCKET"
        mc anonymous set none "local/$$AWS_CLOUD_FILES_BUCKET"

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: orbit-onlyoffice
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-orbit-local-onlyoffice-secret-32chars}
      JWT_HEADER: Authorization
      ALLOW_PRIVATE_IP_ADDRESS: "true"
      ALLOW_META_IP_ADDRESS: "true"
    ports:
      - "8082:80"
    volumes:
      - orbit_onlyoffice_data:/var/www/onlyoffice/Data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 10

volumes:
  orbit_pg_data:
  orbit_redis_data:
  orbit_minio_data:
  orbit_onlyoffice_data:
