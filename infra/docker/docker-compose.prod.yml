services:
  caddy:
    image: caddy:2-alpine
    container_name: orbit-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - orbit_internal

  redis:
    image: redis:7-alpine
    container_name: orbit-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - orbit_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orbit_internal

  backend:
    image: ${ECR_REGISTRY:-815802019553.dkr.ecr.ap-southeast-1.amazonaws.com}/orbit-backend:${BACKEND_TAG:-latest}
    container_name: orbit-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - orbit_internal

  frontend:
    image: ${ECR_REGISTRY:-815802019553.dkr.ecr.ap-southeast-1.amazonaws.com}/orbit-frontend:${FRONTEND_TAG:-latest}
    container_name: orbit-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - orbit_internal

volumes:
  caddy_data:
  caddy_config:
  orbit_redis_data:

networks:
  orbit_internal:
    driver: bridge
