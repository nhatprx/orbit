services:
  postgres:
    image: postgres:16-alpine
    container_name: orbit-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orbit}
      POSTGRES_USER: ${POSTGRES_USER:-orbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbit_dev}
    ports:
      - "5432:5432"
    volumes:
      - orbit_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - orbit_local

  redis:
    image: redis:7-alpine
    container_name: orbit-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - orbit_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - orbit_local

  minio:
    image: minio/minio:latest
    container_name: orbit-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-orbit_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-orbit_minio_dev}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - orbit_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - orbit_local

  minio-init:
    image: minio/mc:latest
    container_name: orbit-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-orbit_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-orbit_minio_dev}
      AWS_CLOUD_FILES_BUCKET: ${AWS_CLOUD_FILES_BUCKET:-orbit-cloud-files}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$AWS_CLOUD_FILES_BUCKET"
        mc anonymous set none "local/$$AWS_CLOUD_FILES_BUCKET"
    networks:
      - orbit_local

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: orbit-backend
    env_file:
      - path: ../../.env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-orbit}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-orbit}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-orbit_dev}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
      AWS_S3_ENABLED: ${AWS_S3_ENABLED:-true}
      AWS_CLOUD_FILES_BUCKET: ${AWS_CLOUD_FILES_BUCKET:-orbit-cloud-files}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-http://minio:9000}
      AWS_S3_PUBLIC_ENDPOINT: ${AWS_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      AWS_S3_PATH_STYLE_ACCESS: ${AWS_S3_PATH_STYLE_ACCESS:-true}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-orbit_minio}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-orbit_minio_dev}
      AWS_CLOUDFRONT_ENABLED: ${AWS_CLOUDFRONT_ENABLED:-false}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - ${USERPROFILE:-~}/.aws:/home/orbit/.aws:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - orbit_local

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${SERVER_PORT:-8080}
    container_name: orbit-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - orbit_local

volumes:
  orbit_pg_data:
  orbit_redis_data:
  orbit_minio_data:

networks:
  orbit_local:
    driver: bridge
