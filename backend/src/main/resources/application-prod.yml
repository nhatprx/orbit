spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

orbit:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://orbit.nhatprx.com}
  frontend:
    url: ${FRONTEND_URL:https://orbit.nhatprx.com}
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  storage:
    s3:
      enabled: ${AWS_S3_ENABLED:true}
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:ap-southeast-1}
      presign-duration-minutes: ${AWS_S3_PRESIGN_DURATION_MINUTES:15}

logging:
  level:
    root: INFO
    com.orbit: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
