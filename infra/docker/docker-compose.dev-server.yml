services:
  redis:
    image: redis:7-alpine
    container_name: orbit-dev-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-replace-with-strong-dev-redis-password}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - "${REDIS_BIND_ADDRESS:-0.0.0.0}:${REDIS_PORT:-6379}:6379"
    volumes:
      - orbit_dev_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orbit_dev_internal

volumes:
  orbit_dev_redis_data:

networks:
  orbit_dev_internal:
    driver: bridge
